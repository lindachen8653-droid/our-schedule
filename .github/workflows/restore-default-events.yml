name: Restore original events

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/restore-default-events.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore missing original events safely
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_init = "const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],safeParse=(k,fb)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??fb}catch{return fb}};let events=safeParse(STORAGE.events,null);if(!Array.isArray(events)){events=DEFAULT_EVENTS;saveEvents()}let todos=safeParse(STORAGE.todos,[]),currentMonth=8,travelDay=1,filters=safeParse(STORAGE.filters,null);if(!Array.isArray(filters))filters=CATEGORIES.map(c=>c.id);let deferredPrompt=null;"
          new_init = "const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],safeParse=(k,fb)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??fb}catch{return fb}};function restoreDefaultsIfMissing(list){const base=Array.isArray(list)?list:[];const hasOriginal=base.some(e=>String(e?.id||'').startsWith('seed-'));return hasOriginal?{events:base,changed:false}:{events:[...base,...DEFAULT_EVENTS],changed:true}}let events=safeParse(STORAGE.events,null);{const restored=restoreDefaultsIfMissing(events);events=restored.events;if(restored.changed)saveEvents()}let todos=safeParse(STORAGE.todos,[]),currentMonth=8,travelDay=1,filters=safeParse(STORAGE.filters,null);if(!Array.isArray(filters))filters=CATEGORIES.map(c=>c.id);let deferredPrompt=null;"
          if old_init not in s:
              raise SystemExit('initial event loader anchor not found')
          s = s.replace(old_init, new_init, 1)

          old_refresh = "function refreshFromCloud(){events=safeParse(STORAGE.events,[]);todos=safeParse(STORAGE.todos,[]);const savedFilters=safeParse(STORAGE.filters,null);if(Array.isArray(savedFilters))filters=savedFilters;$('#memoText').value=localStorage.getItem(STORAGE.memo)||'';$('#shoppingList').value=localStorage.getItem(STORAGE.shopping)||'';refreshAll()}"
          new_refresh = "function refreshFromCloud(){const restored=restoreDefaultsIfMissing(safeParse(STORAGE.events,[]));events=restored.events;if(restored.changed)saveEvents();todos=safeParse(STORAGE.todos,[]);const savedFilters=safeParse(STORAGE.filters,null);if(Array.isArray(savedFilters))filters=savedFilters;$('#memoText').value=localStorage.getItem(STORAGE.memo)||'';$('#shoppingList').value=localStorage.getItem(STORAGE.shopping)||'';refreshAll()}"
          if old_refresh not in s:
              raise SystemExit('cloud refresh anchor not found')
          s = s.replace(old_refresh, new_refresh, 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8').replace('our-schedule-cloud-v12-20260829','our-schedule-cloud-v13-20260829')
          sw.write_text(w, encoding='utf-8')
          PY
      - name: Commit recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Restore missing original calendar events"
          git push
