name: Fix inline refresh syntax

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-inline-refresh-syntax.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("window.addEventListener('ourschedule:cloud-data',refreshFromCloud)window.addEventListener", "window.addEventListener('ourschedule:cloud-data',refreshFromCloud);window.addEventListener")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix in-place cloud refresh syntax"
          git push
