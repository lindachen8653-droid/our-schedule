name: Add category owner filter

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/add-category-owner-filter.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add owner first category picker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<label>分類<select id="category" required></select></label><label>圖示<select id="iconSelect"></select></label>'
          new='<label>對象<select id="categoryOwner"><option value="ling">🎀 鈴</option><option value="sheng">🐶 生</option><option value="shared">💛 共同</option><option value="all">✨ 全部</option></select></label><label>分類<select id="category" required></select></label><label>圖示<select id="iconSelect"></select></label>'
          if old not in s: raise SystemExit('form category anchor missing')
          s=s.replace(old,new,1)

          old_new="function openNew(ds){$('#modalTitle').textContent='新增行程';$('#eventForm').reset();$('#eventId').value='';$('#deleteEvent').style.display='none';$('#startDate').value=ds||'2026-09-01';$('#endDate').value=ds||'2026-09-01';$('#category').value='ling-work';$('#iconSelect').value='🖥️';toggleTime();openModal()}"
          new_new="function openNew(ds){$('#modalTitle').textContent='新增行程';$('#eventForm').reset();$('#eventId').value='';$('#deleteEvent').style.display='none';$('#startDate').value=ds||'2026-09-01';$('#endDate').value=ds||'2026-09-01';$('#categoryOwner').value='ling';renderCategoryOptions('ling','ling-work');$('#iconSelect').value='🖥️';toggleTime();openModal()}"
          if old_new not in s: raise SystemExit('openNew anchor missing')
          s=s.replace(old_new,new_new,1)

          old_edit="$('#endTime').value=e.endTime||'';$('#category').value=e.category;$('#iconSelect').value=e.icon||'📌';"
          new_edit="$('#endTime').value=e.endTime||'';$('#categoryOwner').value=e.owner||'all';renderCategoryOptions(e.owner||'all',e.category);$('#iconSelect').value=e.icon||'📌';"
          if old_edit not in s: raise SystemExit('openEdit anchor missing')
          s=s.replace(old_edit,new_edit,1)

          old_init="function initOptions(){$('#category').innerHTML=CATEGORIES.map(c=>`<option value=\"${c.id}\">${esc(c.label)}（${ownerLabel(c.owner)}）</option>`).join('');$('#iconSelect').innerHTML=ICONS.map(i=>`<option value=\"${esc(i)}\">${esc(i)}</option>`).join('')}"
          new_init="function renderCategoryOptions(owner='all',selectedId=''){const list=owner==='all'?CATEGORIES:CATEGORIES.filter(c=>c.owner===owner);$('#category').innerHTML=list.map(c=>`<option value=\"${c.id}\">${esc(c.label)}${owner==='all'?`（${ownerLabel(c.owner)}）`:''}</option>`).join('');const selected=list.some(c=>c.id===selectedId)?selectedId:(list[0]?.id||'');$('#category').value=selected}$('#categoryOwner').addEventListener('change',()=>renderCategoryOptions($('#categoryOwner').value,''));function initOptions(){renderCategoryOptions('ling','ling-work');$('#iconSelect').innerHTML=ICONS.map(i=>`<option value=\"${esc(i)}\">${esc(i)}</option>`).join('')}"
          if old_init not in s: raise SystemExit('initOptions anchor missing')
          s=s.replace(old_init,new_init,1)

          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8').replace('our-schedule-cloud-v16-20260829','our-schedule-cloud-v17-20260829')
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Commit category picker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Add owner first category picker"
          git push
