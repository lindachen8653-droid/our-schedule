name: Diary icon three states
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/diary-icon-three-states.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update diary icon states
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function diaryMood(ds){const d=normalizedDiaryDay(ds);return d.ling&&d.sheng?'💟':'📖'}"
          new="function diaryMood(ds){const d=normalizedDiaryDay(ds),count=(d.ling?1:0)+(d.sheng?1:0);return count===0?'📝':count===1?'📖':'💟'}"
          if old not in s: raise SystemExit('diaryMood anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          sw.write_text(sw.read_text(encoding='utf-8').replace('our-schedule-cloud-v26-20260830','our-schedule-cloud-v27-20260830'),encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for i,b in enumerate(re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,re.S)):
            Path(f'/tmp/i{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/i*.js; do node --check "$f"; done
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Show three diary completion states"
          git push
