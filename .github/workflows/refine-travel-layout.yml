name: Refine travel layout
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/refine-travel-layout.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch travel layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="travel-hero"><h2>🐱✈️ 福岡・5天旅程</h2><p>左邊看行程與時間，右邊放照片與簡短敘述</p></div>','<div class="travel-hero"><h2>🐱✈️ 福岡・5天旅程</h2></div>')
          s=s.replace('grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr)','grid-template-columns:1fr')
          s=s.replace('.trip-layout,.trip-item,.overview-controls,.backup-grid{grid-template-columns:1fr}', '.trip-layout,.overview-controls,.backup-grid{grid-template-columns:1fr}.trip-item{grid-template-columns:minmax(0,1fr) minmax(130px,.78fr)}')
          s=s.replace('${esc(e.icon)} ${esc(e.name)}','${esc(e.icon)} ${esc(String(e.name||\"\").split(\" | Day \" )[0])}')
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          sw.write_text(sw.read_text(encoding='utf-8').replace('our-schedule-cloud-v21-20260830','our-schedule-cloud-v22-20260830'),encoding='utf-8')
          PY
      - name: Check JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for i,b in enumerate(re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,re.S)):
            Path(f'/tmp/i{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/i*.js; do node --check "$f"; done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Refine travel reference layout"
          git push
