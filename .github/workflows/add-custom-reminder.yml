name: Add custom reminder
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/add-custom-reminder.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch custom reminder UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<option value="1440">1 天前</option></select></label>'
          new='<option value="1440">1 天前</option><option value="custom">自訂時間</option></select><div id="customReminderWrap" style="display:none;margin-top:8px"><input id="customReminderMinutes" type="number" min="1" max="10080" step="1" inputmode="numeric" placeholder="輸入幾分鐘前，例如 45"><div class="small" style="margin-top:4px">最多可設定 10080 分鐘（7 天）前</div></div></label>'
          if old not in s: raise SystemExit('reminder select anchor missing')
          s=s.replace(old,new,1)

          s=s.replace("$('#reminderEnabled').addEventListener('change',toggleReminder);function toggleReminder(){$('#reminderWrap').style.display=$('#reminderEnabled').checked?'block':'none'}", "$('#reminderEnabled').addEventListener('change',toggleReminder);$('#reminderMinutes').addEventListener('change',toggleCustomReminder);function toggleCustomReminder(){$('#customReminderWrap').style.display=$('#reminderMinutes').value==='custom'?'block':'none'}function toggleReminder(){$('#reminderWrap').style.display=$('#reminderEnabled').checked?'block':'none';toggleCustomReminder()}",1)

          s=s.replace("$('#reminderEnabled').checked=!!e.reminderEnabled;$('#reminderMinutes').value=String(e.reminderMinutes??30);toggleReminder();", "$('#reminderEnabled').checked=!!e.reminderEnabled;const rm=Number(e.reminderMinutes??30),preset=[0,10,30,60,1440].includes(rm);$('#reminderMinutes').value=preset?String(rm):'custom';$('#customReminderMinutes').value=preset?'':String(rm);toggleReminder();",1)

          s=s.replace("$('#reminderEnabled').checked=false;$('#reminderMinutes').value='30';toggleTime();toggleReminder();", "$('#reminderEnabled').checked=false;$('#reminderMinutes').value='30';$('#customReminderMinutes').value='';toggleTime();toggleReminder();",1)

          old_save="reminderEnabled:$('#reminderEnabled').checked,reminderMinutes:Number($('#reminderMinutes').value||30)};"
          new_save="reminderEnabled:$('#reminderEnabled').checked,reminderMinutes:$('#reminderMinutes').value==='custom'?Math.max(1,Math.min(10080,Number($('#customReminderMinutes').value||30))):Number($('#reminderMinutes').value||30)};"
          if old_save not in s: raise SystemExit('save anchor missing')
          s=s.replace(old_save,new_save,1)

          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          sw.write_text(sw.read_text(encoding='utf-8').replace('our-schedule-cloud-v29-20260830','our-schedule-cloud-v30-20260830'),encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for i,b in enumerate(re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,re.S)):
            Path(f'/tmp/i{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/i*.js; do node --check "$f"; done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Add custom event reminder time"
          git push
