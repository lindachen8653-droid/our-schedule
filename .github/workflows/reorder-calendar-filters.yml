name: Reorder calendar filters

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/reorder-calendar-filters.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder shared sheng ling all
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="chips=[{id:'all',label:'✨ 全部',on:allOn},{id:'owner-sheng',label:'🐶 生',on:!allOn&&ownerOn('sheng')},{id:'owner-ling',label:'🎀 鈴',on:!allOn&&ownerOn('ling')},{id:'owner-shared',label:'💛 共同',on:!allOn&&ownerOn('shared')}]"
          new="chips=[{id:'owner-shared',label:'💛 共同',on:!allOn&&ownerOn('shared')},{id:'owner-sheng',label:'🐶 生',on:!allOn&&ownerOn('sheng')},{id:'owner-ling',label:'🎀 鈴',on:!allOn&&ownerOn('ling')},{id:'all',label:'✨ 全部',on:allOn}]"
          if old not in s: raise SystemExit('filter chips anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8').replace('our-schedule-cloud-v18-20260829','our-schedule-cloud-v19-20260829')
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Commit reorder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Reorder calendar filters"
          git push
