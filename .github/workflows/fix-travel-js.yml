name: Fix travel JavaScript

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-travel-js.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix broken newline regex
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          broken="split(/\n+/)"
          fixed="split(/\\n+/)"
          if broken not in s:
              raise SystemExit('broken travel regex not found')
          s=s.replace(broken,fixed,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8').replace('our-schedule-cloud-v20-20260830','our-schedule-cloud-v21-20260830')
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,re.S)
          for i,b in enumerate(blocks):
              Path(f'/tmp/inline-{i}.js').write_text(b,encoding='utf-8')
          print(len(blocks))
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Fix travel page JavaScript"
          git push
