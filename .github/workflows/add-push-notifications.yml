name: Add push notifications

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/add-push-notifications.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Web Push client
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud.js')
          s=p.read_text(encoding='utf-8')

          s=s.replace("const AUTH_REDIRECT = 'https://lindachen8653-droid.github.io/our-schedule/';", "const AUTH_REDIRECT = 'https://lindachen8653-droid.github.io/our-schedule/';\nconst VAPID_PUBLIC_KEY = 'BD1xUc57xHTTJwrcBr83FQS5LAmkBp425Kz9bhxUHvYT0E-uP8vDrD3_J689inMlq9wt4gMvWOLwsjd5WI0Yw50';")
          s=s.replace("let toastTimer = null;", "let toastTimer = null;\nlet lastEventState = new Map();")

          s=s.replace("    <button id=\"cloudApplyRemote\" class=\"cloud-mini-btn\" type=\"button\" hidden>套用更新</button>", "    <button id=\"cloudApplyRemote\" class=\"cloud-mini-btn\" type=\"button\" hidden>套用更新</button>\n    <button id=\"cloudNotify\" class=\"cloud-mini-btn\" type=\"button\">🔔 通知</button>")

          anchor="const cloudApplyRemote = cloudBar.querySelector('#cloudApplyRemote');"
          addition=r'''
const cloudNotify = cloudBar.querySelector('#cloudNotify');
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(ch => ch.charCodeAt(0)));
}
function eventMap(events) { return new Map((Array.isArray(events) ? events : []).map(e => [String(e.id), e])); }
function detectEventChange(beforeMap, afterEvents) {
  const afterMap = eventMap(afterEvents);
  const changes = [];
  for (const [id, ev] of afterMap) {
    if (!beforeMap.has(id)) changes.push({ action:'added', event:ev });
    else if (JSON.stringify(beforeMap.get(id)) !== JSON.stringify(ev)) changes.push({ action:'updated', event:ev });
  }
  for (const [id, ev] of beforeMap) if (!afterMap.has(id)) changes.push({ action:'deleted', event:ev });
  return { changes, afterMap };
}
async function savePushSubscription(subscription) {
  if (!session || !activeSpace || !subscription) return;
  const json = subscription.toJSON();
  const { error } = await supabase.from('push_subscriptions').upsert({
    user_id: session.user.id,
    space_id: activeSpace.space_id,
    endpoint: json.endpoint,
    p256dh: json.keys?.p256dh,
    auth: json.keys?.auth,
    updated_at: new Date().toISOString()
  }, { onConflict: 'endpoint' });
  if (error) throw error;
}
async function ensurePushSubscription(promptUser = false) {
  if (!session || !activeSpace) return false;
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
    if (promptUser) alert('此瀏覽器目前不支援系統推播。iPhone 請先用 Safari「分享 → 加入主畫面」，再從主畫面開啟 Our Schedule。');
    return false;
  }
  if (Notification.permission === 'denied') {
    if (promptUser) alert('通知權限目前被關閉，請到 iPhone「設定 → 通知 → Our Schedule」重新開啟。');
    return false;
  }
  if (promptUser && Notification.permission === 'default') {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return false;
  }
  if (Notification.permission !== 'granted') return false;
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
  await savePushSubscription(sub);
  cloudNotify.textContent = '🔔 已開啟';
  return true;
}
async function sendSchedulePush(change) {
  if (!change || !activeSpace || !session) return;
  try {
    await supabase.functions.invoke('send-schedule-push', { body:{ space_id:activeSpace.space_id, action:change.action, event:change.event } });
  } catch {}
}
cloudNotify.addEventListener('click', async () => {
  try {
    const ok = await ensurePushSubscription(true);
    if (ok) showToast('通知已開啟。對方新增、修改或刪除行程時會收到推播。');
  } catch (error) { showToast(friendlyError(error)); }
});
'''
          if 'function urlBase64ToUint8Array' not in s:
              s=s.replace(anchor, anchor+addition, 1)

          s=s.replace("    refreshAppInPlace();\n    return;", "    lastEventState = eventMap((row.data || {}).events);\n    refreshAppInPlace();\n    ensurePushSubscription(false).catch(()=>{});\n    return;", 1)
          s=s.replace("  setStatus('synced', '已同步');\n}\nfunction schedulePush()", "  lastEventState = eventMap((row.data || {}).events);\n  ensurePushSubscription(false).catch(()=>{});\n  setStatus('synced', '已同步');\n}\nfunction schedulePush()", 1)

          old="""    if (data) setRaw(markerKey(activeSpace.space_id), String(data));
    setStatus('synced', '已同步');"""
          new="""    if (data) setRaw(markerKey(activeSpace.space_id), String(data));
    const currentEvents = snapshot().events;
    const diff = detectEventChange(lastEventState, currentEvents);
    lastEventState = diff.afterMap;
    if (diff.changes.length > 0 && diff.changes.length <= 3) {
      for (const change of diff.changes) await sendSchedulePush(change);
    }
    setStatus('synced', '已同步');"""
          if old not in s: raise SystemExit('pushSnapshot anchor missing')
          s=s.replace(old,new,1)

          old2="""  applySnapshot(remote.data || {});
  if (remote.updated_at) setRaw(markerKey(activeSpace.space_id), remote.updated_at);
  refreshAppInPlace();"""
          new2="""  const before = lastEventState;
  const incomingEvents = Array.isArray(remote.data?.events) ? remote.data.events : [];
  const diff = detectEventChange(before, incomingEvents);
  applySnapshot(remote.data || {});
  lastEventState = diff.afterMap;
  if (remote.updated_at) setRaw(markerKey(activeSpace.space_id), remote.updated_at);
  refreshAppInPlace();
  if (diff.changes.length === 1) {
    const c=diff.changes[0], verb=c.action==='added'?'新增':c.action==='deleted'?'刪除':'修改';
    showToast(`🔔 對方${verb}：${c.event?.startDate||''} ${c.event?.name||'行程'}`);
  }"""
          if old2 not in s: raise SystemExit('remote anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          w=w.replace('our-schedule-cloud-v14-20260829','our-schedule-cloud-v15-20260829')
          if "addEventListener('push'" not in w:
              w += '''\nself.addEventListener('push',event=>{let data={};try{data=event.data?event.data.json():{}}catch{};const title=data.title||'Our Schedule';const options={body:data.body||'共用行程有更新',tag:data.tag||'our-schedule-update',icon:'./icon.svg',badge:'./icon.svg',data:{url:data.url||'./'}};event.waitUntil(self.registration.showNotification(title,options))});\nself.addEventListener('notificationclick',event=>{event.notification.close();const url=event.notification.data?.url||'./';event.waitUntil(clients.matchAll({type:'window',includeUncontrolled:true}).then(list=>{for(const c of list){if('focus'in c)return c.focus()}return clients.openWindow?clients.openWindow(url):null}))});\n'''
          sw.write_text(w,encoding='utf-8')

          idx=Path('index.html')
          x=idx.read_text(encoding='utf-8').replace('./cloud.js?v=20260829-3','./cloud.js?v=20260829-4')
          idx.write_text(x,encoding='utf-8')
          PY
      - name: Commit push upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud.js sw.js index.html
          git diff --cached --quiet || git commit -m "Add shared calendar push notifications"
          git push
