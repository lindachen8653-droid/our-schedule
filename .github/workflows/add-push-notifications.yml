name: Add push notifications

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/add-push-notifications.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply push notification patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit push upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud.js sw.js index.html
          git diff --cached --quiet || git commit -m "Add shared calendar push notifications"
          git push
