name: Reminder notification title
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/reminder-notification-title.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make reminder notifications direct
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('our-schedule-cloud-v32-20260830','our-schedule-cloud-v33-20260830')
          old="""  let title=data.title||'Our Schedule';\n  let body=data.body||'共用行程有更新';\n  const m=body.match(/\\[DIARY:(ling|sheng):(added|updated|deleted)\\]/);\n  if(m){\n    const person=m[1]==='ling'?'鈴':'生';\n    const verb=m[2]==='added'?'新增了日記':m[2]==='updated'?'更新了日記':'刪除了日記';\n    title=`📖 ${person}${verb}`;\n    body=body.replace(/\\[DIARY:(ling|sheng):(added|updated|deleted)\\]\\s*/,'').trim();\n  }\n"""
          new="""  let title=data.title||'Our Schedule';\n  let body=data.body||'共用行程有更新';\n  const reminder=body.match(/^(\\d{4}-\\d{2}-\\d{2})\\s+(\\d{2}:\\d{2})\\s+⏰\\s*提醒：\\s*(.+)$/);\n  if(reminder){\n    title=`${reminder[1]} ${reminder[2]} ${reminder[3].trim()}`;\n    body='';\n  }else{\n    const m=body.match(/\\[DIARY:(ling|sheng):(added|updated|deleted)\\]/);\n    if(m){\n      const person=m[1]==='ling'?'鈴':'生';\n      const verb=m[2]==='added'?'新增了日記':m[2]==='updated'?'更新了日記':'刪除了日記';\n      title=`📖 ${person}${verb}`;\n      body=body.replace(/\\[DIARY:(ling|sheng):(added|updated|deleted)\\]\\s*/,'').trim();\n    }\n  }\n"""
          if old not in s: raise SystemExit('push handler anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          i=Path('index.html')
          h=i.read_text(encoding='utf-8').replace("navigator.serviceWorker.register('./sw.js?v=20260830-32')","navigator.serviceWorker.register('./sw.js?v=20260830-33')")
          i.write_text(h,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for i,b in enumerate(re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,re.S)): Path(f'/tmp/i{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/i*.js; do node --check "$f"; done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git diff --cached --quiet || git commit -m "Show reminder details directly in notification"
          git push
