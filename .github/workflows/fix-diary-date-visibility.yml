name: Fix diary date visibility
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/fix-diary-date-visibility.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move diary status below date
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.diary-trigger{position:absolute;right:3px;top:3px;border:0;background:transparent;padding:2px;font-size:10px;z-index:3;line-height:1.15;text-align:right;white-space:nowrap}', '.diary-trigger{display:block;position:static;width:100%;border:0;background:transparent;padding:0 3px 3px;text-align:left;font-size:9px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#6f6464}',1)
          # Ensure date remains visually first with enough room.
          s=s.replace('.day .date{font-weight:800;margin-bottom:4px}', '.day .date{font-weight:800;margin-bottom:2px;position:relative;z-index:2}',1)
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          sw.write_text(sw.read_text(encoding='utf-8').replace('our-schedule-cloud-v24-20260830','our-schedule-cloud-v25-20260830'),encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for i,b in enumerate(re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,re.S)):
            Path(f'/tmp/i{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/i*.js; do node --check "$f"; done
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Keep calendar dates visible with diary status"
          git push
