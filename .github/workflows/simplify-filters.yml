name: Simplify calendar filters

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify filter buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''function renderFilters(){const allOn=filters.length===CATEGORIES.length,ownerOn=o=>CATEGORIES.filter(c=>c.owner===o).every(c=>filters.includes(c.id)),chips=[{id:'all',label:'✨ 全部',on:allOn},{id:'owner-sheng',label:'🐶 生',on:ownerOn('sheng')},{id:'owner-ling',label:'🎀 鈴',on:ownerOn('ling')},...CATEGORIES.map(c=>({id:c.id,label:c.label,on:filters.includes(c.id)}))];$('#filters').innerHTML=chips.map(x=>`<button class="chip ${x.on?'on':''}" data-filter="${x.id}">${esc(x.label)}</button>`).join('');const names=CATEGORIES.filter(c=>filters.includes(c.id)).map(c=>c.name);$('#currentFilter').textContent=`目前顯示：${names.length?names.join('、'):'未選擇任何行程分類'}（國定假日仍顯示）`}'''
          new='''function renderFilters(){const allOn=filters.length===CATEGORIES.length,ownerOn=o=>CATEGORIES.filter(c=>c.owner===o).every(c=>filters.includes(c.id)),chips=[{id:'all',label:'✨ 全部',on:allOn},{id:'owner-sheng',label:'🐶 生',on:ownerOn('sheng')},{id:'owner-ling',label:'🎀 鈴',on:ownerOn('ling')},{id:'owner-shared',label:'💛 共同',on:ownerOn('shared')}];$('#filters').innerHTML=chips.map(x=>`<button class="chip ${x.on?'on':''}" data-filter="${x.id}">${esc(x.label)}</button>`).join('');const owners=[];if(ownerOn('sheng'))owners.push('生');if(ownerOn('ling'))owners.push('鈴');if(ownerOn('shared'))owners.push('共同');$('#currentFilter').textContent=`目前顯示：${allOn?'全部':owners.length?owners.join('、'):'自訂／未完整選擇'}（國定假日仍顯示）`}'''
          if old in s:
              p.write_text(s.replace(old,new),encoding='utf-8')
          elif "owner-shared',label:'💛 共同'" not in s:
              raise SystemExit('Target filter block not found')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify calendar filters"
          git push
