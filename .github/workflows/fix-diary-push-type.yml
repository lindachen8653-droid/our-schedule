name: Fix diary push type
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/fix-diary-push-type.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch diary notification flow
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('cloud.js'); s=c.read_text(encoding='utf-8')
          old="function detectDiaryChanges(before,after){const changes=[];const dates=new Set([...Object.keys(before||{}),...Object.keys(after||{})]);for(const date of dates){for(const owner of ['ling','sheng']){const b=before?.[date]?.[owner]||null,a=after?.[date]?.[owner]||null;if(JSON.stringify(b)===JSON.stringify(a))continue;changes.push({date,owner,action:a?'added':'deleted',mood:a?.mood||''})}}return changes;}"
          new="function detectDiaryChanges(before,after){const changes=[];const dates=new Set([...Object.keys(before||{}),...Object.keys(after||{})]);for(const date of dates){for(const owner of ['ling','sheng']){const b=before?.[date]?.[owner]||null,a=after?.[date]?.[owner]||null;if(JSON.stringify(b)===JSON.stringify(a))continue;const action=!b&&a?'added':b&&!a?'deleted':'updated';changes.push({date,owner,action,mood:a?.mood||b?.mood||''})}}return changes;}"
          if old not in s: raise SystemExit('detectDiaryChanges anchor missing')
          s=s.replace(old,new,1)
          old2="await sendSchedulePush({action:d.action,event:{id:`diary-${d.date}-${d.owner}`,name:`📖 ${d.owner==='ling'?'鈴':'生'}的日記 ${d.mood||''}`,startDate:d.date,allDay:true}})"
          new2="await sendSchedulePush({action:d.action,event:{id:`diary-${d.date}-${d.owner}`,name:`[DIARY:${d.owner}:${d.action}] ${d.mood||''}`,startDate:d.date,allDay:true}})"
          if old2 not in s: raise SystemExit('diary send anchor missing')
          s=s.replace(old2,new2,1)
          c.write_text(s,encoding='utf-8')

          p=Path('index.html'); h=p.read_text(encoding='utf-8')
          h=h.replace("navigator.serviceWorker.register('./sw.js')","navigator.serviceWorker.register('./sw.js?v=20260830-31')")
          h=h.replace('./cloud.js?v=20260829-5','./cloud.js?v=20260830-31')
          p.write_text(h,encoding='utf-8')

          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8')
          w=w.replace('our-schedule-cloud-v30-20260830','our-schedule-cloud-v31-20260830')
          start=w.index("self.addEventListener('push',event=>{")
          end=w.index("self.addEventListener('notificationclick'",start)
          push="""self.addEventListener('push',event=>{\n  let data={};\n  try{data=event.data?event.data.json():{}}catch{}\n  let title=data.title||'Our Schedule';\n  let body=data.body||'共用行程有更新';\n  const m=body.match(/\\[DIARY:(ling|sheng):(added|updated|deleted)\\]/);\n  if(m){\n    const person=m[1]==='ling'?'鈴':'生';\n    const verb=m[2]==='added'?'新增了日記':m[2]==='updated'?'更新了日記':'刪除了日記';\n    title=`📖 ${person}${verb}`;\n    body=body.replace(/\\[DIARY:(ling|sheng):(added|updated|deleted)\\]\\s*/,'').trim();\n  }\n  const options={body,tag:data.tag||'our-schedule-update',icon:'./icon.svg',badge:'./icon.svg',data:{url:data.url||'./'}};\n  event.waitUntil(self.registration.showNotification(title,options));\n});\n"""
          w=w[:start]+push+w[end:]
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check cloud.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for i,b in enumerate(re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,re.S)):
            Path(f'/tmp/i{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/i*.js; do node --check "$f"; done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud.js index.html sw.js
          git diff --cached --quiet || git commit -m "Fix diary push notification labels"
          git push
