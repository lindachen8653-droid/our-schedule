name: Add day event picker

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/add-day-event-picker.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add editable day event picker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css='.day-list-modal{width:min(520px,100%);max-height:80vh;overflow:auto;background:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow)}.day-list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.day-list-head h3{margin:0}.day-list-items{display:grid;gap:9px}.day-list-item{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px;text-align:left;color:var(--ink)}.day-list-item:active{transform:scale(.99)}.day-list-main{display:flex;align-items:center;justify-content:space-between;gap:10px}.day-list-name{font-weight:750}.day-list-meta{font-size:12px;color:var(--muted);margin-top:4px}.day-list-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}'
          if '.day-list-modal{' not in s:
              s=s.replace('.backup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}', '.backup-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}'+css, 1)

          modal='''\n<div id="dayListModal" class="modal-backdrop" aria-hidden="true"><div class="day-list-modal" role="dialog" aria-modal="true" aria-labelledby="dayListTitle"><div class="day-list-head"><h3 id="dayListTitle">當日行程</h3><button id="dayListCloseX" class="modal-x" aria-label="關閉">×</button></div><div id="dayListItems" class="day-list-items"></div><div class="day-list-actions"><button id="dayListAdd" class="primary" type="button">＋ 新增行程</button><button id="dayListClose" class="ghost" type="button">關閉</button></div></div></div>\n'''
          if 'id="dayListModal"' not in s:
              s=s.replace('<script>\n(()=>{"use strict";', modal+'<script>\n(()=>{"use strict";',1)

          old="$('#calendarGrid').addEventListener('click',e=>{const day=e.target.closest('.day[data-date]');if(!day)return;const list=sorted(events.filter(ev=>occurs(ev,day.dataset.date)));if(list.length===1)openEdit(list[0].id);else if(confirm(`${fmtDay(day.dataset.date)} 行程\\n\\n${list.map(e=>`${e.icon} ${timeText(e)} ${e.name}`).join('\\n')||'無行程'}\\n\\n按「確定」新增行程；按「取消」返回。`))openNew(day.dataset.date)});"
          new="function openDayList(ds,list){$('#dayListTitle').textContent=`${fmtDay(ds)} 行程`;$('#dayListModal').dataset.date=ds;$('#dayListItems').innerHTML=list.length?list.map(ev=>`<button class=\"day-list-item\" type=\"button\" data-edit-id=\"${esc(ev.id)}\"><div class=\"day-list-main\"><span class=\"day-list-name\">${esc(ev.icon)} ${esc(ev.name)}</span><span>編輯 ›</span></div><div class=\"day-list-meta\">${esc(timeText(ev))}${ev.location?` ・ ${esc(ev.location)}`:''} ・ ${ownerLabel(ev.owner)}</div></button>`).join(''):'<div class=\"event-card\">當天尚無行程。</div>';$('#dayListModal').classList.add('open');$('#dayListModal').setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function closeDayList(){$('#dayListModal').classList.remove('open');$('#dayListModal').setAttribute('aria-hidden','true');document.body.style.overflow=''}$('#dayListItems').addEventListener('click',e=>{const b=e.target.closest('[data-edit-id]');if(!b)return;closeDayList();openEdit(b.dataset.editId)});$('#dayListAdd').addEventListener('click',()=>{const ds=$('#dayListModal').dataset.date;closeDayList();openNew(ds)});$('#dayListClose').onclick=closeDayList;$('#dayListCloseX').onclick=closeDayList;$('#dayListModal').addEventListener('click',e=>{if(e.target===$('#dayListModal'))closeDayList()});$('#calendarGrid').addEventListener('click',e=>{const day=e.target.closest('.day[data-date]');if(!day)return;const list=sorted(events.filter(ev=>occurs(ev,day.dataset.date)));if(list.length===1)openEdit(list[0].id);else openDayList(day.dataset.date,list)});"
          if old not in s:
              raise SystemExit('calendar day click handler anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          w=w.replace('our-schedule-cloud-v13-20260829','our-schedule-cloud-v14-20260829')
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Commit picker upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Add editable day event picker"
          git push
