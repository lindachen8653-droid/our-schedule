name: Redesign travel page

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/redesign-travel-page.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redesign travel page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_css='.travel-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}.travel-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;white-space:nowrap}.travel-tabs button.active{background:#5f5555;color:#fff}.trip-layout{display:grid;grid-template-columns:1.4fr .8fr;gap:14px}.trip-side{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.trip-item{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.trip-item:last-child{border-bottom:0}.photo-box{min-height:120px;border:1px dashed #ccbdb6;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fffaf7}.photo-box img{width:100%;height:100%;object-fit:cover}'
          new_css='''.travel-hero{padding:24px 20px;margin-bottom:18px;border:1px solid #f0e3de;border-radius:28px;background:linear-gradient(135deg,#eef9ef 0%,#fff7f5 55%,#fff4fb 100%);box-shadow:var(--shadow)}.travel-hero h2{margin:0 0 12px;font-size:27px}.travel-hero p{margin:0;color:#756969;line-height:1.7}.travel-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:0 0 20px;overflow:visible}.travel-tabs button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:11px 8px;white-space:normal;line-height:1.35;color:var(--ink);min-width:0}.travel-tabs button span{display:block;font-size:12px;margin-top:3px;color:var(--muted)}.travel-tabs button.active{background:#765d67;color:#fff;border-color:#765d67}.travel-tabs button.active span{color:#fff}.travel-day-title{font-size:22px;font-weight:800;margin:4px 2px 14px}.trip-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:18px;align-items:start}.trip-side{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}.trip-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.trip-card-head h3{margin:0;font-size:20px}.travel-add-btn{border:1px solid var(--line);background:#fff;border-radius:18px;padding:10px 14px;color:var(--ink)}.trip-item{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.72fr);gap:16px;border:1px solid #f0e2df;border-radius:20px;padding:16px;margin-top:12px;background:#fffdfc}.trip-item:first-child{margin-top:0}.trip-item .event-title{font-size:18px}.trip-time{font-size:12px;color:#a09292;margin-bottom:6px}.photo-box{min-height:150px;border:1px dashed #d7bfc7;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fffafc;color:#a89198}.photo-box img{width:100%;height:100%;min-height:150px;object-fit:cover}.trip-photo-btn{display:block;text-align:center;border:1px solid var(--line);border-radius:999px;padding:8px 12px;margin-top:9px;background:#fff;cursor:pointer}.shopping-card{position:relative}.shopping-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.shopping-head h3{margin:0;font-size:20px}.shopping-count{color:var(--muted);font-size:14px}.shopping-wrap{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}.shopping-wrap textarea{min-height:150px;margin:0}.shopping-plus{width:58px;border:0;border-radius:22px;background:#765d67;color:#fff;font-size:30px}.trip-empty{padding:28px 12px;text-align:center;color:var(--muted)}'''
          if old_css not in s: raise SystemExit('travel css anchor not found')
          s=s.replace(old_css,new_css,1)

          s=s.replace('.trip-layout,.trip-item,.overview-controls,.backup-grid{grid-template-columns:1fr}', '.trip-layout,.trip-item,.overview-controls,.backup-grid{grid-template-columns:1fr}.travel-tabs{gap:7px}.travel-tabs button{padding:9px 3px;font-size:13px;border-radius:15px}.travel-hero{padding:20px 16px;border-radius:22px}.travel-hero h2{font-size:24px}.trip-side{padding:16px;border-radius:20px}.photo-box,.photo-box img{min-height:130px}',1)

          old_html='<section id="travel" class="page"><div class="section-title"><h3>旅遊模式</h3></div><div id="travelTabs" class="travel-tabs"></div><div class="trip-layout"><div class="trip-side"><div id="tripDayList"></div></div><div class="trip-side"><h3>旅遊購物清單</h3><textarea id="shoppingList" placeholder="藥妝、伴手禮、想買的東西…"></textarea><p class="small">會自動儲存並包含在備份中。</p></div></div></section>'
          new_html='''<section id="travel" class="page"><div class="travel-hero"><h2>🐱✈️ 福岡・5天旅程</h2><p>左邊看行程與時間，右邊放照片與簡短敘述</p></div><div id="travelTabs" class="travel-tabs"></div><div id="travelDayTitle" class="travel-day-title"></div><div class="trip-layout"><div class="trip-side"><div class="trip-card-head"><h3>📍 行程＋照片</h3><button id="travelAddEvent" class="travel-add-btn" type="button">＋ 新增</button></div><div id="tripDayList"></div></div><div class="trip-side shopping-card"><div class="shopping-head"><h3>🛍️ 購物清單</h3><span id="shoppingCount" class="shopping-count">0/0</span></div><div class="shopping-wrap"><textarea id="shoppingList" placeholder="想買什麼？每行一項"></textarea><button id="shoppingPlus" class="shopping-plus" type="button" aria-label="新增購物項目">＋</button></div><p class="small">每行一個品項，內容會自動同步與備份。</p></div></div></section>'''
          if old_html not in s: raise SystemExit('travel html anchor not found')
          s=s.replace(old_html,new_html,1)

          start=s.index('function renderTravel(){')
          end=s.index("$('#travelTabs').addEventListener",start)
          old_func=s[start:end]
          new_func='''function travelDateLabel(ds){const d=new Date(ds+'T12:00:00'),w=['日','一','二','三','四','五','六'][d.getDay()];return `${d.getMonth()+1}/${d.getDate()}（週${w}）`}function renderTravel(){const dates=['2026-10-04','2026-10-05','2026-10-06','2026-10-07','2026-10-08'];$('#travelTabs').innerHTML=dates.map((ds,i)=>`<button class="${travelDay===i+1?'active':''}" data-day="${i+1}">Day ${i+1}<span>${ds.slice(5)}</span></button>`).join('');const ds=dates[travelDay-1],list=sorted(events.filter(e=>e.category.endsWith('travel')&&occurs(e,ds)));$('#travelDayTitle').textContent=`🐾 ${travelDateLabel(ds)}`;$('#tripDayList').innerHTML=list.length?list.map(e=>tripHTML(e,ds)).join(''):'<div class="trip-empty">尚未安排旅遊行程，按右上「＋ 新增」開始安排。</div>';renderShoppingCount()}function tripHTML(e,ds){const key=`${e.id}:${ds}`,photos=safeParse(STORAGE.tripPhotos,{}),caps=safeParse(STORAGE.captions,{}),photo=photos[key],cap=caps[key]||{show:false,text:''};return `<div class="trip-item"><div><div class="trip-time">${e.allDay?'✈️ 全天':`⏰ ${esc(timeText(e))}`}</div><div class="event-title">${esc(e.icon)} ${esc(e.name)}</div><div class="event-meta">${e.location?`📍 ${esc(e.location)}`:''}${e.notes?`<br>${esc(e.notes)}`:''}</div><button class="ghost edit-trip" data-id="${esc(e.id)}" style="margin-top:10px">編輯行程</button></div><div><label class="photo-box">${photo?`<img src="${photo}" alt="">`:'<span>尚未加入照片</span>'}<input type="file" accept="image/*" class="trip-photo" data-key="${esc(key)}" hidden></label><label class="trip-photo-btn">📷 加入照片<input type="file" accept="image/*" class="trip-photo" data-key="${esc(key)}" hidden></label><label class="check small" style="margin-top:8px"><input type="checkbox" class="cap-show" data-key="${esc(key)}" ${cap.show?'checked':''}> 顯示簡短敘述</label><input class="cap-text" data-key="${esc(key)}" value="${esc(cap.text||'')}" placeholder="例如：太宰府散步" ${cap.show?'':"style='display:none'"}></div></div>`}function renderShoppingCount(){const items=($('#shoppingList').value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);$('#shoppingCount').textContent=`0/${items.length}`}'''
          s=s[:start]+new_func+s[end:]

          s=s.replace("$('#shoppingList').value=localStorage.getItem(STORAGE.shopping)||'';$('#shoppingList').addEventListener('input',e=>localStorage.setItem(STORAGE.shopping,e.target.value));", "$('#shoppingList').value=localStorage.getItem(STORAGE.shopping)||'';$('#shoppingList').addEventListener('input',e=>{localStorage.setItem(STORAGE.shopping,e.target.value);renderShoppingCount()});$('#shoppingPlus').addEventListener('click',()=>{$('#shoppingList').focus();const v=$('#shoppingList').value;if(v&&!v.endsWith('\\n'))$('#shoppingList').value=v+'\\n';renderShoppingCount()});$('#travelAddEvent').addEventListener('click',()=>{const dates=['2026-10-04','2026-10-05','2026-10-06','2026-10-07','2026-10-08'],ds=dates[travelDay-1];openNew(ds);$('#categoryOwner').value='ling';renderCategoryOptions('ling','ling-travel');$('#category').value='ling-travel';$('#iconSelect').value='✈️'});",1)

          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8').replace('our-schedule-cloud-v19-20260829','our-schedule-cloud-v20-20260830')
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Commit travel redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Redesign travel itinerary page"
          git push
