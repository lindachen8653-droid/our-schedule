<body>
<div class="app">
<header class="topbar"><div class="brand"><div><h1>Our Schedule</h1><small>工作・生活・愛</small></div><button id="installBtn" class="ghost" style="display:none">加入主畫面</button></div><nav class="nav" id="nav"><button data-page="dashboard" class="active">首頁</button><button data-page="calendar">月曆</button><button data-page="overview">總覽</button><button data-page="memo">備忘錄</button><button data-page="travel">旅遊</button><button data-page="backup">備份</button></nav></header>
<main>
<section id="dashboard" class="page active"><div class="hero"><h2>Our Schedule</h2><p>工作・生活・愛</p><div class="stats"><div class="stat ling"><b id="countLing">0</b><span>鈴行程</span></div><div class="stat sheng"><b id="countSheng">0</b><span>生行程</span></div><div class="stat shared"><b id="countShared">0</b><span>共同行程</span></div></div></div><div class="section-title"><h3>近期行程</h3><span class="small">依日期排序</span></div><div id="upcoming" class="cards"></div></section>

<section id="overview" class="page"><div class="section-title"><h3>行程總覽</h3></div><div class="overview-controls"><input id="searchInput" placeholder="搜尋行程、地點、標籤"><select id="ownerFilter"><option value="all">全部</option><option value="sheng">生</option><option value="ling">鈴</option><option value="shared">共同</option></select></div><div id="overviewList" class="cards"></div></section>
<section id="memo" class="page"><div class="section-title"><h3>備忘錄</h3><button id="clearMemo" class="danger">清空</button></div><textarea id="memoText" class="memo" placeholder="想到什麼就寫在這裡，內容會自動儲存。"></textarea><div class="small">自動儲存於此裝置。</div></section>
<section id="travel" class="page"><div class="travel-hero"><h2>🐱✈️ 福岡・5天旅程</h2><p>左邊看行程與時間，右邊放照片與簡短敘述</p></div><div id="travelTabs" class="travel-tabs"></div><div id="travelDayTitle" class="travel-day-title"></div><div class="trip-layout"><div class="trip-side"><div class="trip-card-head"><h3>📍 行程＋照片</h3><button id="travelAddEvent" class="travel-add-btn" type="button">＋ 新增</button></div><div id="tripDayList"></div></div><div class="trip-side shopping-card"><div class="shopping-head"><h3>🛍️ 購物清單</h3><span id="shoppingCount" class="shopping-count">0/0</span></div><div class="shopping-wrap"><textarea id="shoppingList" placeholder="想買什麼？每行一項"></textarea><button id="shoppingPlus" class="shopping-plus" type="button" aria-label="新增購物項目">＋</button></div><p class="small">每行一個品項，內容會自動同步與備份。</p></div></div></section>
<section id="backup" class="page"><div class="section-title"><h3>資料備份</h3></div><div class="event-card"><p>匯出會包含 events、todos、memo、shopping list、trip photos、photo captions、calendar filters。</p><div class="backup-grid"><button id="exportBackup" class="primary">匯出 JSON 備份</button><label class="ghost" style="text-align:center;cursor:pointer">匯入 JSON<input id="importBackup" type="file" accept="application/json,.json" hidden></label></div></div></section>
</main></div>
<button id="fab" class="fab" aria-label="新增行程">＋</button>
<div id="eventModal" class="modal-backdrop" aria-hidden="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button id="modalClose" class="modal-x" aria-label="關閉">×</button><h3 id="modalTitle">新增行程</h3><form id="eventForm"><input type="hidden" id="eventId"><div class="form-grid"><label>開始日期<input type="date" id="startDate" required min="2026-09-01" max="2026-12-31"></label><label>結束日期<input type="date" id="endDate" required min="2026-09-01" max="2026-12-31"></label><label class="check full"><input type="checkbox" id="allDay"> 全天行程</label><label>開始時間<input type="time" id="startTime"></label><label>結束時間<input type="time" id="endTime"></label><label>對象<select id="categoryOwner"><option value="ling">🎀 鈴</option><option value="sheng">🐶 生</option><option value="shared">💛 共同</option></select></label><label>分類<select id="category" required></select></label><label>圖示<select id="iconSelect"></select></label><label class="full">行程名稱<input id="eventName" required maxlength="80" placeholder="例如：早班、福岡旅行、約會"></label><label class="full">地點<input id="location" maxlength="100" placeholder="地點"></label><label class="full">標籤<input id="tags" maxlength="120" placeholder="用逗號分隔"></label><label class="full">備註<textarea id="notes" placeholder="補充資訊"></textarea></label></div><div class="actions"><div class="left-actions"><button type="button" id="deleteEvent" class="danger" style="display:none">刪除</button></div><div class="right-actions"><button type="button" id="cancelEvent" class="ghost">取消</button><button type="submit" class="primary">儲存</button></div></div></form></div></div>
